include:
  - /home/roland/docker/common/volumes.yaml

services:
  qbittorrent-wireguard:
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    container_name: "qbittorrent-wireguard"
    entrypoint:
      - "/bin/bash"
      - "/start.sh"
    environment:
      - "PUID=1000"
      - "PGID=1000"
      - "TZ=Europe/London"
      - "LAN_NETWORK=192.168.50.0/24"
      - "QBT_LEGAL_NOTICE=confirm"
      - "ENABLEPROTONVPNPORTFWD=1"
      # one lost ping over the VPN restarted the container every few minutes
      - "HEALTH_CHECK_AMOUNT=5"
      # Proton drops a NAT-PMP port 60s after the last renew; the script renews once per interval
      - "HEALTH_CHECK_INTERVAL=45"
      - "WEBUI_URL=http://192.168.50.206:8080"
      # Optional Cloudflare Access variables
      # - "CF_ACCESS_CLIENT_ID=<your-client-id>"
      # - "CF_ACCESS_CLIENT_SECRET=<your-client-secret>"
    image: "docker.io/tenseiken/qbittorrent-wireguard:latest"
    ipc: "private"
    network_mode: "bridge"
    ports:
      - "8999:8999/tcp"
      - "8999:8999/udp"
      - "8080:8080/tcp"
    restart: "unless-stopped"
    security_opt:
      - "label=disable"
    stdin_open: true
    sysctls:
      - "net.ipv4.conf.all.rp_filter=2"
      - "net.ipv4.conf.all.src_valid_mark=1"
      - "net.ipv6.conf.all.disable_ipv6=1"
    tty: true
    volumes:
      - downloads:/downloads # optional
      - qbittorrent_config:/config
      - qbittorrent_modules:/lib/modules
    working_dir: "/opt"
