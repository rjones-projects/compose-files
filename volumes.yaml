# All host-folder volumes for every stack. Stacks include the copy at /home/roland/docker/common/volumes.yaml (see portainer-setup.md).
# Docker keeps these options when a volume is created: after changing a device, stop its stacks and `docker volume rm` the volume.
# device is the Linux host folder under /home/roland/docker. The folder must already exist.
# The windows lines are Docker Desktop's path to the D:\ folder, e.g. D:\downloads is /run/desktop/mnt/host/d/downloads.
volumes:
  common:
    name: common
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/roland/docker/common
      # windows: device: /run/desktop/mnt/host/d/docker/common
  downloads:
    name: downloads
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/elements/downloads
      # windows: device: /run/desktop/mnt/host/d/downloads
  movies:
    name: movies
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/elements/movies
      # windows: device: /run/desktop/mnt/host/d/movies
  tvseries:
    name: tvseries
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/elements/tvseries
      # windows: device: /run/desktop/mnt/host/d/tvseries
