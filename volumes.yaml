# All D:\ volumes for every stack. Portainer reads this from /data/common/volumes.yaml (see portainer-setup).
# Docker keeps these options when a volume is created: after changing a device, stop its stacks and `docker volume rm` the volume.
# device is Docker Desktop's path to the host folder, e.g. D:\downloads is /run/desktop/mnt/host/d/downloads. The folder must already exist.
# The linux lines assume ~/docker on a Linux host. Docker does not expand ~ here, so write the full path, e.g. /home/<user>/docker/downloads.
volumes:
  downloads:
    name: downloads
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/d/downloads
      # linux: device: ~/docker/downloads
  movies:
    name: movies
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/d/movies
      # linux: device: ~/docker/movies
  tvseries:
    name: tvseries
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/d/tvseries
      # linux: device: ~/docker/tvseries
  caddy_data:
    name: caddy_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/d/docker/caddy/data
      # linux: device: ~/docker/caddy/data
  diun_data:
    name: diun_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/d/docker/diun
      # linux: device: ~/docker/diun
  pihole_etc:
    name: pihole_etc
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/d/docker/pihole/etc
      # linux: device: ~/docker/pihole/etc
  pihole_dnsmasq:
    name: pihole_dnsmasq
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/d/docker/pihole/dnsmasq
      # linux: device: ~/docker/pihole/dnsmasq
  plex_config:
    name: plex_config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/d/docker/plex
      # linux: device: ~/docker/plex
  portainer_data:
    name: portainer_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/d/docker/portainer/data
      # linux: device: ~/docker/portainer/data
  prowlarr_data:
    name: prowlarr_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/d/docker/prowlarr/data
      # linux: device: ~/docker/prowlarr/data
  qbittorrent_config:
    name: qbittorrent_config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/d/docker/qbittorrent/config
      # linux: device: ~/docker/qbittorrent/config
  qbittorrent_modules:
    name: qbittorrent_modules
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/d/docker/qbittorrent/lib/modules
      # linux: device: ~/docker/qbittorrent/lib/modules
  radarr_data:
    name: radarr_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/d/docker/radarr/data
      # linux: device: ~/docker/radarr/data
  seerr_data:
