---
services:
  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - D:\docker\overseerr\config:/config
    ports:
      - 5055:5055
    restart: unless-stopped
    labels:
      caddy: overseerr.kinexa.co.uk
      caddy.reverse_proxy: "{{upstreams 9443}}"
    networks:
      - caddy

networks:
  caddy:
    external: true