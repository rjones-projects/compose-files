services:
  diun:
    image: crazymax/diun:latest
    command: serve
    volumes:
      - D:\docker\diun:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - "TZ=Europe/London"
      - "DIUN_WATCH_WORKERS=20"
      - "DIUN_WATCH_SCHEDULE=0 */6 * * *"
      - "DIUN_WATCH_JITTER=30s"
      - "DIUN_PROVIDERS_DOCKER=true"
    healthcheck:
      test: ["CMD", "diun", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "diun.enable=true"
    restart: always