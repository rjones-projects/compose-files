services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    ports:
      - 9000:9000
      - 9443:9443
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    labels:
      caddy: portainer.kinexa.co.uk
      caddy.reverse_proxy: "{{upstreams 9443}}"
    networks:
      - caddy

networks:
  caddy:
    external: true
volumes:
  portainer_data:
    external: true