services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    ports:
      - 9000:9000
      - 9443:9443
    volumes:
      - D:\docker\portainer\data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    #if you want to expose portainer uncomment these and add valid URL
    #otherwise you can access portainer via http://localhost:9000
    # labels:
    #   caddy: portainer.kinexa.co.uk
    #   caddy.reverse_proxy: "{{upstreams 9000}}"    
    networks:
      - caddy

networks:
  caddy:
    external: true
