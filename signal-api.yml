services:
  signal-cli-rest-api:
    image: bbernhard/signal-cli-rest-api:latest
    environment:
      - MODE=normal # supported modes: json-rpc, native, normal
      - AUTO_RECEIVE_SCHEDULE=0 22 * * * # enable this parameter on demand
    ports:
      - "8086:8080" # map docker port 8080 to host port 8080.
    volumes:
      - D:\docker\signal-api:/home/.local/share/signal-cli # map "signal-cli-config" folder on host system into docker container. the folder contains the password and cryptographic keys when a new number is registered

# register a new number (replace <sender number> with your number, e.g. +447380244476)
# curl -X POST -H "Content-Type: application/json" \
#  'http://localhost:8086/v1/register/<sender number>' \
#  -d '{"use_voice": false, "captcha": "signalcaptcha://signal-hcaptcha.XXXX..."}'

# apply verification code (replace <sender number> with your number, e.g.  and <verification code> with the code you received via SMS or voice call)
# curl -X POST -H "Content-Type: application/json" \
#  'http://localhost:8086/v1/register/<sender number>/verify/<verification code>'

#Send a test message (replace <sender number> with your number and <recipient number> with the recipient's number(s))
 curl -X POST -H "Content-Type: application/json" -d '{"message": "test worked", "number": "<sender_number>", "recipients": ["<recipient_number>"]}' 'http://127.0.0.1:8086/v2/send'