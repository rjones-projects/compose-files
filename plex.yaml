services:
  plex:
    image: linuxserver/plex:latest 
    container_name: plex
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - PLEX_CLAIM= #optional
    ports:
      - 32400:32400
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
      - 32469:32469
    volumes:
      - D:\docker\plex:/config
      - D:\movies:/movies
      - D:\tvseries:/tv 
    restart: unless-stopped
    labels:
      caddy: plex.kinexa.co.uk
      caddy.reverse_proxy: "{{upstreams 32400}}"
    networks:
      - caddy
networks:
  caddy:
    external: true    