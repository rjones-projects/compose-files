include:
  - /data/common/volumes.yaml

services:
  plex:
    image: linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - PLEX_CLAIM= # optional
    ports:
      # Main port for Plex Web App
      - 32400:32400
      # Optional ports for the plex g'day discovery service
      # - 32410:32410/udp
      # - 32412:32412/udp
      # - 32413:32413/udp
      # - 32414:32414/udp
      # Optional ports for DLNA
      # - 1900:1900/udp
      # - 32469:32469
    volumes:
      - plex_config:/config
      - movies:/movies
      - tvseries:/tv
    restart: unless-stopped
    labels:
      caddy: plex.kinexa.co.uk
      caddy.reverse_proxy: "{{upstreams 32400}}"
    networks:
      - caddy

networks:
  caddy:
    external: true
