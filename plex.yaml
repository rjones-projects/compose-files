services:
  plex:
    image: linuxserver/plex:latest 
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - PLEX_CLAIM= #optional
    volumes:
      - D:\docker\plex:/config
      - D:\downloads\movies:/movies
      - D:\docker\downloads\tv:/tv 
    restart: unless-stopped
    labels:
      caddy: plex.kinexa.co.uk
      caddy.reverse_proxy: "{{upstreams 32400}}"
    networks:
      - caddy
networks:
  caddy:
    external: true    