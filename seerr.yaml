include:
  - /data/common/volumes.yaml

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      # - LOG_LEVEL=debug
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - 5055:5055
    volumes:
      - seerr_data:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    labels:
      caddy: seerr.kinexa.co.uk
      caddy.reverse_proxy: "{{upstreams 5055}}"
    networks:
      - caddy

networks:
  caddy:
    external: true
