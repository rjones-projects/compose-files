include:
  - /data/common/volumes.yaml

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - sonarr_data:/config
      - tvseries:/tv # optional
      - downloads:/downloads # optional
    ports:
      - 8989:8989
    restart: unless-stopped
    labels:
      caddy: sonarr.kinexa.co.uk
      caddy.reverse_proxy: "{{upstreams 8989}}"
    networks:
      - caddy

networks:
  caddy:
    external: true
